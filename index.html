<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="css\bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>3D Cube Scroll</title> 
    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden;
        }
        .vertContainer {
            width: 100vw; 
            height: 100vh; 
            transform-style: preserve-3d; 
            transition: transform 1s; 
        }
        .block {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0; 
            left: 0;
            color: white;
        }
        .fon{
            width: 100%;
            background-color: white;
        }
        nav{
            font-size: 25px;
        }
        .putin{
            width: 100px;
            height: 100px;
            border-radius:20px;
            background-image: url("./i\ \(1\).png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

    </style>
</head>
<body>
    <div class="vertContainer" style="transform: rotateX(0deg);">
        <div class="block" style="background-color:white;transform:rotateX(0deg) translateZ(68.7vh);">
            <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
                <div class="container-fluid">
                  <a class="navbar-brand" href="#"><div class="putin"></div></a>
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                  </button>
                  <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                      <a class="nav-link active" aria-current="page" href="#">Главная</a>
                      <a class="nav-link" href="#">Чтото</a>
                      <a class="nav-link" href="#">Цены наверно</a>
                      <a class="nav-link">Не жмать</a>
                    </div>
                  </div>
                </div>
            </nav>
        </div>
        <div class="block" style="background:url(./1.jpg) no-repeat center/cover;transform:rotateX(-72deg) translateZ(68.8vh);">2</div> 
        <div class="block" style="background:url(./2.jpg) no-repeat center/cover;transform:rotateX(-144deg) translateZ(68.8vh);">3</div> 
        <div class="block" style="background:url(./3.jpg) no-repeat center/cover;transform:rotateX(-216deg) translateZ(68.8vh);">4</div> 
        <div class="block" style="background:url(./4.jpg) no-repeat center/cover;transform:rotateX(-288deg) translateZ(68.8vh);">5</div> 
    </div>
<div class="fon"></div>


    <script>
        let vertContainer = document.querySelector('.vertContainer'); 
        let blocks = document.querySelectorAll('.block'); 
        let currentRotation = 0;
        let rotationStep = 360 / blocks.length;

        window.addEventListener('wheel', (event) => { 
            if(event.altKey){
                blocks.forEach((block, index) => { 
                    let angle = -rotationStep * index; 
                    block.style.transform = `rotateY(${angle}deg) translateZ(138.3vh)`;
                });
                if (event.deltaY > 0) { 
                    currentRotation += rotationStep; 
                } else if (event.deltaY < 0) {
                    currentRotation -= rotationStep; 
                }
                vertContainer.style.transform = `rotateY(${currentRotation}deg)`;
            }else{
                blocks.forEach((block, index) => { 
                    let angle = -rotationStep * index; 
                    block.style.transform = `rotateX(${angle}deg) translateZ(68.7vh)`;
                });
                if (event.deltaY > 0) { 
                    currentRotation += rotationStep; 
                } else if (event.deltaY < 0) {
                    currentRotation -= rotationStep; 
                }
                vertContainer.style.transform = `rotateX(${currentRotation}deg)`;
            }
        });
    </script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
